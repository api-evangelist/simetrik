notes: >-
  Two real documents are served, both by the MCP host mcp.us.simetrik.com: an RFC 8414 OAuth 2.0
  Authorization Server metadata document and an RFC 9728 OAuth 2.0 Protected Resource metadata
  document. The protected-resource document is NOT at the bare /.well-known/oauth-protected-resource
  path - it is path-scoped to the MCP resource at /.well-known/oauth-protected-resource/mcp, which is
  exactly what the 401 challenge from https://mcp.us.simetrik.com/mcp advertises in its
  WWW-Authenticate header (resource_metadata="https://mcp.us.simetrik.com/.well-known/oauth-protected-resource/mcp").
  A bare probe of that host misses it, which is why both paths are recorded below.
  Two hosts answer 200 to every /.well-known/* path with a non-document body and are recorded as
  misses, not hits: cli.simetrik.com is a single-artifact CDN origin that returns the shell installer
  script for any path, and app.simetrik.com is a single-page-app catch-all that returns the console
  HTML shell. simetrik.com (WordPress behind an edge) returns 403 to every /.well-known/* path,
  including security.txt.
