    surface; there is no AsyncAPI document and no webhook catalog.
domain_standards:
  market: Financial reconciliation, accounting close and payments operations
  note: >-
    REWARD-ONLY check. Simetrik's contract surface (CLI + MCP) declares no domain-standard message
    format in itself - there is no ISO 20022 message type, X12/EDIFACT envelope, FDX or PSD2 shape, no
    OData $metadata and no SCIM URN anywhere in the published CLI spec surface, the MCP documentation
    or the OAuth metadata. What Simetrik ships is a generic ingestion-and-matching engine that consumes
    whatever format a bank, card network, PSP or ERP emits, plus per-ERP connections configured with
    ordinary HTTP auth methods (BASIC, BEARER, API_KEY, OAUTH1, OAUTH2). No domain standard is claimed
    here because none is declared in the contract; a prose claim on a marketing page would not qualify
    and none was found either.
  declared: []
