  description: >-
    Operate the Simetrik CLI end-to-end. Covers BUILDING reconciliation resources - native sources,
    segments, calculated columns, unions, joins, groups, legacy and advanced reconciliations, sweeps,
    compensations, consolidations, opening records and data exports - from a JSON definition file or a
    Markdown implementation plan, and OPERATING them once built: manual reconciliation and
