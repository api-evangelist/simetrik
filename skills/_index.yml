  critical_rules:
  - Stop on any error; do not execute the next command, and do not invent alternative payloads to
    bypass a 4xx/5xx.
  - '`--wait` does not always wait: on `recon run`, `recon confirm`, `adv-recon confirm` and
    `adv-recon execute` it returns instantly with exit 0 without waiting.'
  - A `--wait` timeout is not a failure - the job keeps running; poll `task status <EVENT_ID>` rather
    than re-dispatching.
  - Use `--format json` on every create command.
  - Pass `-y/--yes` on every destructive command in a non-interactive run.
  - A `list` result is a page, not the whole set - `resource list` returns at most 50 rows by default
    (max 200) and a partial page carries a `warnings` field saying so.
