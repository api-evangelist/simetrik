note: >-
  Simetrik publishes no pricing of any kind - no plans, no tiers, no per-transaction or per-record
  rate, no free tier, no trial. There is no /pricing/ page (404) and no pricing entry anywhere in the
  site's own published page sitemap, which lists every English, Spanish and Portuguese page. The
  primary and only conversion path in the site navigation is "Request a demo"
  (https://simetrik.com/request-demo/, HTTP 200), with "Login" (https://app.simetrik.com/) for
  existing customers. This is a deliberate enterprise sales motion rather than a missing page - the
  product is sold to PSPs, acquirers, issuers, banks and marketplaces, and account provisioning
  (workspaces, roles, the CLI/agent access gate, export quotas, even integration connections) is
  described throughout the docs as administrator- or support-provisioned.
quota_signals_without_prices:
  note: >-
