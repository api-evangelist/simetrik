technical_controls_published:
- Encryption in transit on all external and internal communications.
- Encryption at rest for all stored data.
- Least-privilege access.
- Defence in depth.
- >-
  PAN truncation at the agent boundary - the MCP server sends only the first six and last four digits
  of a card number, matching the masking the web app shows on screen.
- Every MCP call is authenticated, authorized and logged, acting as the signed-in user.
vulnerability_disclosure:
  published: false
  security_txt: false
  security_txt_note: >-
    /.well-known/security.txt returns 403 on simetrik.com, 404 on docs.simetrik.com and
    mcp.us.simetrik.com, and a shell-installer body on cli.simetrik.com. No RFC 9116 file is served on
    any host.
  bug_bounty: false
  bug_bounty_note: hackerone.com/simetrik and bugcrowd.com/simetrik both return 404.
  disclosure_page: false
  security_contact: null
  note: >-
    HONEST GAP. Simetrik publishes a formal information security policy and a full certification set,
    but no external vulnerability disclosure path - no security.txt, no /security/disclosure page, no
    published security@ address, no bug bounty. The incident reporting described in the policy is
    internal, aimed at employees, contractors and third parties, not at outside researchers. For a
    platform holding reconciliation data for banks, PSPs, issuers and acquirers, a served
    /.well-known/security.txt would be the single cheapest fix available.
