note: >-
  probe-security-programs.py returned trust=none for this provider. That was a false negative: the
  trust center is served from a CNAME subdomain (trust.simetrik.com ->
  667b5a6ebb4f7b57d3197659.cname.vantatrust.com) whose body is a JavaScript shell, so an automated
  content probe finds no certification strings. The certifications below are read from Simetrik's own
  first-party security page, which names them in prose, not from the trust center itself.
trust_center:
  published: true
  url: https://trust.simetrik.com/
  http_status: 200
  title: Simetrik Trust Center
  provider: Vanta
  provider_evidence: trust.simetrik.com is a CNAME to 667b5a6ebb4f7b57d3197659.cname.vantatrust.com
  content_readable: false
  content_note: >-
    The page returns a 7 KB HTML shell and renders its content client-side, so the certification list,
    document requests and subprocessor inventory are not machine-readable from the served body. Access
    to actual audit reports is the usual Vanta gated flow (request + NDA), not an open download.
  linked_from: Site header and footer navigation on simetrik.com, labelled "Trust Center".
