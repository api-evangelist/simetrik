apis:
- aid: simetrik-mcp-server
  name: Simetrik MCP Server
  description: >-
    Simetrik's hosted remote Model Context Protocol server. An MCP client adds one URL and signs in with
    a Simetrik account over OAuth 2.1 (authorization code + PKCE, dynamic client registration) - there is
    no API key to create, copy or rotate. The server exposes read tools (workspace overview, resources,
    match rules, row data, dashboards, datasets, previews, lineage, the dependency graph), session tools
    that add or drop a workspace from the conversation, and a single write path, ask_simetrik_agent,
    which hands build-and-change work to the Simetrik Agent and confirms before every run. US region only.
  humanURL: https://docs.simetrik.com/mcp
  baseURL: https://mcp.us.simetrik.com/mcp
