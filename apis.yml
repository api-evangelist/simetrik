aid: simetrik
name: Simetrik
description: >-
  Simetrik is an AI-powered financial control and reconciliation platform, founded in Bogota, Colombia,
  that sits underneath a company's finance stack and reconciles transactions across payment gateways,
  banks, card networks, ERPs, internal ledgers and operational systems. The platform pairs a no-code
  reconciliation engine (native sources, segments, calculated columns, unions, joins, groups, standard
  and advanced reconciliations, sweeps, compensations, consolidations, opening records and data exports)
  with an Accounting Translator, an Operation Center, scheduling, alarms and approvals. Its developer
  surface is deliberately agent-first rather than REST-first: Simetrik publishes a cross-platform
  `simetrik` CLI, a versioned Claude Agent Skill bundle shipped in lockstep with that CLI, and a hosted
  remote MCP server at https://mcp.us.simetrik.com/mcp that an MCP client connects to with a single URL
  and an OAuth sign-in, with no API key to create or rotate. Customers are concentrated in payments and
  financial services: PSPs, acquirers, issuers, marketplaces, neobanks, banks and retailers.
