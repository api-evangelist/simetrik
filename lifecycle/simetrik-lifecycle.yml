  channels: [stable]
  channel_note: >-
    The installer accepts SIMETRIK_CHANNEL / --channel, but only `stable` is published in the release
    manifest today.
  manifest: https://cli.simetrik.com/cli/manifest.json
  api_versioning: none-published
  api_versioning_note: >-
    There is no public HTTP API and therefore no path or header version to record. Client/server
    compatibility is negotiated instead: the CLI caches a BFF compatibility record
    (~/.simetrik/bff_compat.json) that `simetrik cache clear` forces to revalidate on the next command.
  upgrade:
    command: simetrik update
    behaviour: >-
      For standalone-binary installs the command performs the upgrade. For Homebrew or npm installs it
      does NOT touch the package manager - it prints the matching upgrade command and stops.
